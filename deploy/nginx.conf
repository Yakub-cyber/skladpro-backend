# nginx перед API: TLS, HTTP/2, второй слой rate-limit, таймауты.
# Сертификат: certbot --nginx -d api.skladpro.ru
# Установка: скопировать в /etc/nginx/sites-available/skladpro-api и включить симлинком.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

upstream skladpro_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.skladpro.ru;   # ← ваш домен

    ssl_certificate     /etc/letsencrypt/live/api.skladpro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.skladpro.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # Auth-эндпоинты — жёстче (перебор паролей).
    location /v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://skladpro_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime SSE через LISTEN/NOTIFY — стрим держим час, буферизацию/кеш
    # выключаем (иначе клиент увидит события порциями раз в 4 КБ, а не сразу).
    # Rate-limit не применяем: одно долгоживущее соединение на клиента.
    location = /v1/events {
        proxy_pass http://skladpro_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://skladpro_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name api.skladpro.ru;
    return 301 https://$host$request_uri;
}
